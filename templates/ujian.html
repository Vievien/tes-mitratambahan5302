<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ujian Online</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: auto;
    padding: 20px;
    background: #f5f5f5;
}

.header{
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

#timerBox{
    position: sticky;
    top: 0;
    z-index: 999;
    background: #fff3cd;
    color: #856404;
    text-align: center;
    padding: 15px;
    font-size: 24px;
    font-weight: bold;
    border-radius: 10px;
    margin-bottom: 20px;
}

.soal{
    background: white;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;
}

.pilihan{
    display: block;
    margin-top: 10px;
    cursor: pointer;
}

.submit-btn{
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #1565c0;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.submit-btn:hover{
    background: #0d47a1;
}

</style>
</head>

<body>

<div class="header">

<h2>SELEKSI MITRA TAMBAHAN</h2>

<p><b>{{ nama }}</b></p>

<p>{{ email }}</p>

</div>

<div id="timerBox">
⏰ Sisa Waktu:
<span id="timer">60:00</span>
</div>

<form id="formUjian">

{% for q in questions %}

<div class="soal">

<p>
<b>
{{ loop.index }}.
{{ q["Soal"] }}
</b>
</p>

<label class="pilihan">
<input type="radio" name="q{{ q['No'] }}" value="A">
A. {{ q["A"] }}
</label>

<label class="pilihan">
<input type="radio" name="q{{ q['No'] }}" value="B">
B. {{ q["B"] }}
</label>

<label class="pilihan">
<input type="radio" name="q{{ q['No'] }}" value="C">
C. {{ q["C"] }}
</label>

<label class="pilihan">
<input type="radio" name="q{{ q['No'] }}" value="D">
D. {{ q["D"] }}
</label>

<label class="pilihan">
<input type="radio" name="q{{ q['No'] }}" value="E">
E. {{ q["E"] }}
</label>

</div>

{% endfor %}

<button
type="button"
class="submit-btn"
onclick="submitJawaban()">

Submit Jawaban

</button>

</form>

<script>

let totalSeconds = 3600;

let timerInterval;

function startTimer(){

    timerInterval = setInterval(function(){

        let menit = Math.floor(totalSeconds / 60);
        let detik = totalSeconds % 60;

        document.getElementById("timer").innerText =
            String(menit).padStart(2,"0")
            + ":"
            +
            String(detik).padStart(2,"0");

        totalSeconds--;

        if(totalSeconds < 0){

            clearInterval(timerInterval);

            alert("Waktu habis. Jawaban akan dikirim otomatis.");

            submitJawaban(true);
        }

    },1000);

}

startTimer();

function submitJawaban(autoSubmit=false){

    let answers = [];

    {% for q in questions %}

    let pilihan_{{ q['No'] }} =
        document.querySelector(
            'input[name="q{{ q["No"] }}"]:checked'
        );

    if(!autoSubmit && !pilihan_{{ q['No'] }}){

        alert(
            "Soal nomor {{ loop.index }} belum dijawab."
        );

        return;
    }

    answers.push({

        no: "{{ q['No'] }}",

        jawaban:
            pilihan_{{ q['No'] }}
            ? pilihan_{{ q['No'] }}.value
            : ""

    });

    {% endfor %}

    fetch("/submit", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            answers: answers
        })

    })

    .then(response => response.json())

    .then(data => {

        if(data.success){

            document.body.innerHTML = `

                <div style="
                    max-width:600px;
                    margin:auto;
                    margin-top:50px;
                    text-align:center;
                ">

                <h1>Terima Kasih 🎉</h1>

                <h2>Nilai Anda: ${data.nilai}</h2>

                <h3>
                    ${data.lulus ? "LULUS" : "TIDAK LULUS"}
                </h3>

                </div>

            `;
        }

    })

    .catch(error => {

        console.error(error);

        alert("Terjadi kesalahan saat mengirim jawaban.");

    });

}

</script>

</body>
</html>
