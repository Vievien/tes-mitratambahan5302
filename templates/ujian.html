<!DOCTYPE html>
<html>

<head>

  <title>Seleksi Akhir Mitra Tambahan</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial,sans-serif;
      background:#f1f5f9;
      overflow:hidden;
    }

    .topbar{

      width:100%;
      height:70px;

      background:#1565c0;

      color:white;

      display:flex;
      justify-content:space-between;
      align-items:center;

      padding:0 25px;

      box-shadow:0 2px 10px rgba(0,0,0,.2);

    }

    .left-section{
      display:flex;
      flex-direction:column;
    }

    .judul{
      font-size:22px;
      font-weight:bold;
    }

    .user{
      font-size:14px;
      margin-top:4px;
      opacity:.9;
    }

    .logout{

      background:white;
      color:#1565c0;

      text-decoration:none;

      padding:10px 18px;

      border-radius:8px;

      font-weight:bold;

    }

    .iframe-container{

      width:100%;
      height:calc(100vh - 70px);

      background:white;

    }

    iframe{

      width:100%;
      height:100%;

      border:none;

    }

    @media(max-width:768px){

      .topbar{

        flex-direction:column;

        justify-content:center;

        align-items:flex-start;

        height:auto;

        padding:15px;

        gap:10px;

      }

      .iframe-container{
        height:calc(100vh - 120px);
      }

      .judul{
        font-size:18px;
      }

    }

  </style>

</head>

<body>

<div class="topbar">

  <div class="left-section">

    <div class="judul">
      Seleksi Akhir Mitra Tambahan
    </div>

    <div class="user">
      Login sebagai: {{username}}
    </div>

  </div>

  <a href="/logout" class="logout">
    Logout
  </a>

</div>

<div class="iframe-container">

  <iframe
      src="{{link_ujian}}"
      allow="geolocation"
      loading="lazy">
  </iframe>

</div>

<script>

let sudahLogout = false;

function paksaLogout(pesan){

  if(sudahLogout) return;

  sudahLogout = true;

  alert(pesan);

  window.location.replace("/logout");

}

/* ==================================================
   ANDROID + IPHONE
   Jika browser masuk background
================================================== */

document.addEventListener("visibilitychange", function(){

  if(document.hidden){

    paksaLogout(
      "Perpindahan aplikasi/tab terdeteksi. Anda otomatis keluar dari ujian."
    );

  }

});

/* ==================================================
   IOS SAFARI
================================================== */

window.addEventListener("pagehide", function(){

  paksaLogout(
    "Anda meninggalkan halaman ujian."
  );

});

/* ==================================================
   ANDROID
================================================== */

window.addEventListener("blur", function(){

  paksaLogout(
    "Perpindahan aplikasi terdeteksi."
  );

});

/* ==================================================
   BLOK KLIK KANAN
================================================== */

document.addEventListener("contextmenu", function(e){

  e.preventDefault();

});

/* ==================================================
   BLOK COPY
================================================== */

document.addEventListener("copy", function(e){

  e.preventDefault();

});

/* ==================================================
   BLOK CUT
================================================== */

document.addEventListener("cut", function(e){

  e.preventDefault();

});

/* ==================================================
   BLOK PASTE
================================================== */

document.addEventListener("paste", function(e){

  e.preventDefault();

});

/* ==================================================
   BLOK SELECT TEXT
================================================== */

document.addEventListener("selectstart", function(e){

  e.preventDefault();

});

</script>

</body>

</html>
