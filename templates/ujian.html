<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujian Online</title>

<style>
body{
    font-family: Arial;
    max-width: 900px;
    margin: auto;
    padding: 20px;
    background: #f5f5f5;
}

.header{
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

#timerBox{
    position: sticky;
    top: 0;
    background: #fff3cd;
    padding: 15px;
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 20px;
    border-radius: 10px;
}

.soal{
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
}

.pilihan{
    display:block;
    margin-top:8px;
}

button{
    width:100%;
    padding:15px;
    font-size:18px;
    background:#1565c0;
    color:white;
    border:none;
    border-radius:10px;
}

button:disabled{
    background:gray;
}
</style>
</head>

<body>

<div class="header">
    <h2>SELEKSI MITRA TAMBAHAN</h2>
    <p><b>{{ nama }}</b></p>
    <p>{{ email }}</p>
</div>

<div id="timerBox">
⏰ <span id="timer">60:00</span>
</div>

<form id="formUjian">

{% for q in questions %}
<div class="soal">
    <b>{{ loop.index }}. {{ q["Soal"] }}</b>

    <label class="pilihan">
        <input type="radio" name="q{{ q['No'] }}" value="A"> A. {{ q["A"] }}
    </label>

    <label class="pilihan">
        <input type="radio" name="q{{ q['No'] }}" value="B"> B. {{ q["B"] }}
    </label>

    <label class="pilihan">
        <input type="radio" name="q{{ q['No'] }}" value="C"> C. {{ q["C"] }}
    </label>

    <label class="pilihan">
        <input type="radio" name="q{{ q['No'] }}" value="D"> D. {{ q["D"] }}
    </label>

    <label class="pilihan">
        <input type="radio" name="q{{ q['No'] }}" value="E"> E. {{ q["E"] }}
    </label>

</div>
{% endfor %}

<button type="button" id="submitBtn" onclick="submitJawaban(false)">
SUBMIT
</button>

</form>

<script>

let submitted = false;
let totalSeconds = 3600;

// ================= TIMER (FIXED) =================
setInterval(() => {

    if(totalSeconds <= 0){
        submitJawaban(true);
        return;
    }

    let m = Math.floor(totalSeconds / 60);
    let s = totalSeconds % 60;

    document.getElementById("timer").innerText =
        String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");

    totalSeconds--;

}, 1000);


// ================= COLLECT ANSWERS (SAFE VERSION) =================
function collectAnswers(){

    let answers = [];

    {% for q in questions %}

    let selected = document.querySelector(
        'input[name="q{{ q["No"] }}"]:checked'
    );

    answers.push({
        no: "{{ q['No'] }}",
        jawaban: selected ? selected.value : ""
    });

    {% endfor %}

    return answers;
}


// ================= SUBMIT =================
function submitJawaban(auto=false){

    if(submitted) return;
    submitted = true;

    let btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerText = "Mengirim...";

    let answers = collectAnswers();

    fetch("/submit", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ answers: answers })
    })

    .then(res => res.json())
    .then(data => {

        if(data.success){

            document.body.innerHTML = `
                <div style="text-align:center;margin-top:100px;font-family:Arial">
                    <h1>Terima Kasih 🎉</h1>
                    <h2>Nilai Anda: ${data.nilai}</h2>
                    <h3>${data.lulus ? "LULUS" : "TIDAK LULUS"}</h3>
                </div>
            `;

        } else {

            alert(data.message || "Submit gagal");

            submitted = false;
            btn.disabled = false;
            btn.innerText = "SUBMIT";
        }

    })

    .catch(() => {

        alert("Terjadi kesalahan server");

        submitted = false;
        btn.disabled = false;
        btn.innerText = "SUBMIT";
    });

}

</script>

</body>
</html>
