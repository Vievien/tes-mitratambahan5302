<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT FINAL STABLE</title>

<style>
body{font-family:Arial;max-width:900px;margin:auto;padding:20px;background:#f5f5f5}
.header{background:#fff;padding:20px;border-radius:10px;margin-bottom:15px}
#timerBox{position:sticky;top:0;background:#fff3cd;padding:15px;font-size:22px;text-align:center;font-weight:bold}
.soal{background:#fff;padding:15px;margin-bottom:10px;border-radius:10px}
.pilihan{display:block;margin-top:5px}
button{width:100%;padding:15px;font-size:18px;background:#1565c0;color:#fff;border:none;border-radius:10px}
button:disabled{background:gray}
</style>
</head>

<body>

<div class="header">
<h2>SELEKSI MITRA TAMBAHAN</h2>
<p><b>{{ nama }}</b></p>
<p>{{ email }}</p>
</div>

<div id="timerBox">⏰ <span id="timer">60:00</span></div>

<form>

{% for q in questions %}
<div class="soal">

<b>{{ loop.index }}. {{ q["Soal"] }}</b>

<label class="pilihan"><input type="radio" name="q{{ q['No'] }}" value="A"> A. {{ q["A"] }}</label>
<label class="pilihan"><input type="radio" name="q{{ q['No'] }}" value="B"> B. {{ q["B"] }}</label>
<label class="pilihan"><input type="radio" name="q{{ q['No'] }}" value="C"> C. {{ q["C"] }}</label>
<label class="pilihan"><input type="radio" name="q{{ q['No'] }}" value="D"> D. {{ q["D"] }}</label>
<label class="pilihan"><input type="radio" name="q{{ q['No'] }}" value="E"> E. {{ q["E"] }}</label>

</div>
{% endfor %}

<button type="button" id="btn" onclick="submit()">SUBMIT</button>

</form>

<script>

let submitted = false;
let time = 3600;

// ================= TIMER (ANTI CRASH) =================
setInterval(() => {

    let m = Math.floor(time / 60);
    let s = time % 60;

    let el = document.getElementById("timer");
    if(el){
        el.innerText = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
    }

    if(time <= 0){
        submit(true);
        return;
    }

    time--;

}, 1000);


// ================= SAFE COLLECT (NO JINJA JS CRASH) =================
function collect(){

    let result = [];

    document.querySelectorAll(".soal").forEach((s, i) => {

        let selected = s.querySelector("input[type=radio]:checked");

        result.push({
            no: i + 1,
            jawaban: selected ? selected.value : ""
        });

    });

    return result;
}


// ================= SUBMIT =================
function submit(auto=false){

    if(submitted) return;
    submitted = true;

    let btn = document.getElementById("btn");
    btn.disabled = true;
    btn.innerText = "Mengirim...";

    fetch("/submit", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({answers:collect()})
    })
    .then(r=>r.json())
    .then(d=>{

        if(d.success){

            document.body.innerHTML =
            `<div style="text-align:center;margin-top:100px;font-family:Arial">
                <h1>Nilai: ${d.nilai}</h1>
                <h2>${d.lulus ? "LULUS" : "TIDAK LULUS"}</h2>
            </div>`;

        } else {

            alert(d.message || "Gagal submit");

            submitted = false;
            btn.disabled = false;
            btn.innerText = "SUBMIT";
        }

    })
    .catch(()=>{

        alert("Server error");

        submitted = false;
        btn.disabled = false;
        btn.innerText = "SUBMIT";

    });

}

</script>

</body>
</html>
