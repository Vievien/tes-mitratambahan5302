<!DOCTYPE html>
<html>

<head>

  <title>Login Tes Mitra</title>

  <style>

    body{
      font-family:Arial;
      background:linear-gradient(135deg,#1565c0,#42a5f5);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      margin:0;
    }

    .box{
      background:white;
      padding:35px;
      border-radius:15px;
      width:320px;
      box-shadow:0 4px 20px rgba(0,0,0,0.2);
    }

    h2{
      text-align:center;
      color:#1565c0;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:10px;
      margin-bottom:20px;
      box-sizing:border-box;
      border:1px solid #ccc;
      border-radius:8px;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#1565c0;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    .error{
      color:red;
      text-align:center;
      margin-bottom:15px;
    }

  </style>

</head>

<body>

<div class="box">

  <h2>TES MITRA 5302</h2>

  {% if error %}
    <div class="error">
      {{error}}
    </div>
  {% endif %}

  <form method="POST">

    <input
      type="text"
      name="username"
      placeholder="Username"
      required
    >

    <input
      type="password"
      name="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Login
    </button>

  </form>

</div>

</body>

</html>
