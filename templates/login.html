<!DOCTYPE html>
<html>

<head>

  <title>Login Tes Mitra</title>

  <style>

    body{
      font-family:Arial;
      background:linear-gradient(135deg,#1565c0,#42a5f5);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      margin:0;
      overflow:hidden;
    }

    .box{
      background:white;
      padding:35px;
      border-radius:15px;
      width:320px;
      box-shadow:0 4px 20px rgba(0,0,0,0.2);
      position:relative;
      z-index:2;
    }

    h2{
      text-align:center;
      color:#1565c0;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:10px;
      margin-bottom:20px;
      box-sizing:border-box;
      border:1px solid #ccc;
      border-radius:8px;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#1565c0;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#0d47a1;
    }

    .error{
      color:red;
      text-align:center;
      margin-bottom:15px;
    }

    /* =========================
       LOADING OVERLAY
    ========================== */

    .loading-overlay{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(255,255,255,0.95);
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:9999;
    }

    .spinner{
      width:60px;
      height:60px;
      border:6px solid #ddd;
      border-top:6px solid #1565c0;
      border-radius:50%;
      animation:spin 1s linear infinite;
      margin-bottom:20px;
    }

    @keyframes spin{
      100%{
        transform:rotate(360deg);
      }
    }

    .loading-text{
      font-size:18px;
      color:#1565c0;
      font-weight:bold;
    }

  </style>

</head>

<body>

<!-- LOADING -->
<div class="loading-overlay" id="loading">

  <div class="spinner"></div>

  <div class="loading-text">
    Sedang Masuk...
  </div>

</div>

<div class="box">

  <h2>TES MITRA 5302</h2>

  {% if error %}
    <div class="error">
      {{error}}
    </div>
  {% endif %}

  <form method="POST" onsubmit="showLoading()">

    <input
      type="text"
      name="username"
      placeholder="Username"
      required
    >

    <input
      type="password"
      name="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Login
    </button>

  </form>

</div>

<script>

function showLoading(){

  document.getElementById("loading").style.display = "flex";

}

</script>

</body>

</html>
