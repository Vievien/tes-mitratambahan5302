<!DOCTYPE html>
<html>

<head>

  <title>Memuat Ujian...</title>

  <meta http-equiv="refresh" content="2;url=/ujian">

  <style>

    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      background:#1565c0;
      color:white;
      font-family:Arial;
    }

    .spinner{
      width:70px;
      height:70px;
      border:7px solid rgba(255,255,255,0.3);
      border-top:7px solid white;
      border-radius:50%;
      animation:spin 1s linear infinite;
      margin-bottom:25px;
    }

    @keyframes spin{
      100%{
        transform:rotate(360deg);
      }
    }

    h2{
      font-size:24px;
    }

    p{
      opacity:0.9;
    }

  </style>

</head>

<body>

  <div class="spinner"></div>

  <h2>Sedang Membuka Ujian...</h2>

  <p>Mohon tunggu beberapa detik</p>

</body>

</html>
